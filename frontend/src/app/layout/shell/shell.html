<aside class="sidebar">
  <div class="sidebar-brand">
    <span class="brand-mark">A</span>
    <span>Altairis <strong>Backoffice</strong></span>
  </div>

  <nav>
    @for (section of navigation; track section.title) {
      <div class="nav-section">{{ section.title | t }}</div>
      @for (item of section.items; track item.path) {
        <a class="nav-item" [routerLink]="item.path" routerLinkActive="active">{{ item.label | t }}</a>
      }
    }
  </nav>

  <div class="sidebar-footer">{{ 'nav.version' | t }}</div>
</aside>

<div class="main">
  <header class="topbar">
    <span class="env-tag">{{ 'nav.demoEnvironment' | t }}</span>

    <div class="user">
      <app-language-switch />
      <span class="avatar">{{ initials() }}</span>
      <span class="user-name">{{ auth.userName() }}</span>
      <button type="button" class="btn btn-sm" (click)="auth.logout()">{{ 'nav.signOut' | t }}</button>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
