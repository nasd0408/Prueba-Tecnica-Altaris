server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The API is reached through the same origin (/api), so the browser never needs CORS
    # and the frontend doesn't need to know where the API lives.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        # The API reads the real client IP from here (used by the rate limiter on /api/auth).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Build files (main-XXXX.js, chunk-XXXX.js, styles-XXXX.css...) have a content hash in the
    # name: a new build means new names, so they can be cached for a year.
    # A file that doesn't exist must be a real 404. Without this, the SPA fallback below would
    # answer an old chunk name with index.html (HTML instead of JS) and the page would stay blank.
    location ~* \.(?:js|css|map|woff2?|ttf|svg|png|jpg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: deep links like /hotels/12/edit must return index.html
    # and let the Angular router handle them, instead of a 404 from nginx.
    # index.html is never reused without asking the server (no-cache = revalidate every time),
    # so after a deploy the browser always gets the list of the new build's files.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
